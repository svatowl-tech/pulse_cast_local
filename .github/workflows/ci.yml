name: CI — Web & Rust Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web-check:
    name: TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Production Vite build
        run: npm run build

      - name: Upload Vite dist for Tauri check
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-dist
          path: dist/

  rust-check:
    name: Rust & Tauri Check (${{ matrix.os }})
    needs: web-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download Vite dist for Tauri frontendDist
        uses: actions/download-artifact@v8
        with:
          name: ci-web-dist
          path: dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & targets
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native & Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            clang \
            libclang-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake -y --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "$llvmBin" >> $env:GITHUB_PATH

      - name: Run cargo check
        run: cargo check --workspace --all-targets

      - name: Run cargo test
        run: cargo test --workspace
