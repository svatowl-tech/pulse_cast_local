[package]
name = "pulsecast-desktop"
version = "0.1.0"
edition = "2021"
description = "Нативное многооконное десктопное приложение PulseCast Local на базе Tauri v2"
authors = ["PulseCast Contributors"]
license = "MIT"

[lib]
name = "pulsecast_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
pulsecast-local = { path = ".." }
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
